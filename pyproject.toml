[project]
name = "thermometry"
version = "1.0"
description = "FQT thermometry API and website server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "apiflask>=2.4.0",
    "numpy>=2.3.4",
    "pandas>=2.3.3",
    "psycopg2>=2.9.11",
    "pyinstaller>=6.16.0",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
    "schedule>=1.2.2",
    "waitress>=3.0.2",
]

[tool.uv]
package = true

[project.scripts]
website = "thermometry.main:run_website"
alerts = "thermometry.main:run_alerts"
all = "thermometry.main:run_all"
build-listener = "listener.main:build"
build-watchdog = "watchdog.main:build"
