<!DOCTYPE html>
<html lang="en">
<head>
    <title>FQT Status</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-title" content="FQT Thermometry">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#81d1e3">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon-96x96.png') }}" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='uPlot.min.css') }}">
    <style>
			.uplot {
				display: inline-block;
				vertical-align: top;
			}
    </style>
    <script src="{{ url_for('static', filename='uPlot.iife.min.js') }}"></script>
    <script src="{{ url_for('static', filename='gauge.min.js') }}"></script>
    <script src="{{ url_for('static', filename='utils.js') }}"></script>
</head>
<body class="h-screen overflow-hidden bg-gray-100">
    <div id="offline-banner" class="hidden bg-yellow-500 text-black text-center text-sm py-1 px-4 font-medium" role="alert">
        You are offline. Data may be outdated.
    </div>
    <div class="flex flex-col h-screen">

    <!-- Banner -->
    <header class="bg-blue-600 text-white text-xl p-4 shadow-md flex items-center">
            <button id="menuToggle" class="md:hidden mr-3 focus:outline-none" aria-label="Toggle menu">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                </svg>
            </button>
            <span class="flex-1 text-center md:text-center">FQT Lab Thermometry</span>
    </header>

    <div class="flex flex-1 h-full overflow-hidden relative">
            <!-- Sidebar overlay (mobile) -->
            <div id="sidebarOverlay" class="hidden fixed inset-0 bg-black bg-opacity-50 z-20 md:hidden"></div>

            <!-- Sidebar -->
            <nav id="sidebar" class="fixed inset-y-0 left-0 z-30 w-56 bg-gray-800 text-white p-4 space-y-4 overflow-y-auto transform -translate-x-full transition-transform duration-200 md:relative md:translate-x-0 md:w-1/8 md:block">
                <ul class="space-y-2">
                    <li><a href="/dashboard" class="block p-2 hover:bg-gray-700 rounded {% if menu == "all" %}bg-gray-700{% endif %}">All</a></li>
                    <hr class="border-gray-700 my-4">
                    {% for fridge_name in fridges %}
                        <li><a href="/dashboard?fridge={{ fridge_name }}" class="block p-2 hover:bg-gray-700 rounded {% if menu == fridge_name %}bg-gray-700{% endif %}">{{ fridge_name.capitalize() }}</a></li>
                    {% endfor %}
                    <hr class="border-gray-700 my-4">
                    <li><a href="/dashboard/alerts" class="block p-2 hover:bg-gray-700 rounded {% if menu == "alerts" %}bg-gray-700{% endif %}">Alerts</a></li>
                    <li><a href="/dashboard/gauges" class="block p-2 hover:bg-gray-700 rounded {% if menu == "gauges" %}bg-gray-700{% endif %}">Gauges</a></li>
                    <li><a href="/docs" class="block p-2 hover:bg-gray-700 rounded">Docs</a></li>
                </ul>
            </nav>

            <!-- Main Content -->
            <main class="flex-1 p-3 md:p-6 overflow-y-auto">
                <h1 class="text-2xl font-bold mb-4">{{ title }}</h1>
                <div id="workspace" class="bg-white p-3 md:p-6 rounded-lg shadow-md">
                    {% block content %}{% endblock %}
                </div>
            </main>
        </div>

    </div>

    <script>
    (function() {
        const toggle = document.getElementById('menuToggle');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');

        function openMenu() {
            sidebar.classList.remove('-translate-x-full');
            sidebar.classList.add('translate-x-0');
            overlay.classList.remove('hidden');
        }

        function closeMenu() {
            sidebar.classList.remove('translate-x-0');
            sidebar.classList.add('-translate-x-full');
            overlay.classList.add('hidden');
        }

        toggle.addEventListener('click', function() {
            if (sidebar.classList.contains('-translate-x-full')) {
                openMenu();
            } else {
                closeMenu();
            }
        });

        overlay.addEventListener('click', closeMenu);

        // Close menu when a nav link is tapped
        sidebar.querySelectorAll('a').forEach(function(link) {
            link.addEventListener('click', closeMenu);
        });
    })();

    // Offline detection
    function updateOnlineStatus() {
        var banner = document.getElementById('offline-banner');
        if (banner) {
            banner.classList.toggle('hidden', navigator.onLine);
        }
    }
    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);
    updateOnlineStatus();
    </script>
</body>
</html>
