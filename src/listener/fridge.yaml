# Configure the datafiles that the fridge outputs.
# In general this shouldn't change between fridges

# DATE will be replaced with the current date

fridge: "venus"
secret: "venus-key"  # used to sign messages
logdir: "C:\\Users\\LabUser\\Desktop\\Logs"
maxigauge: "maxigauge DATE.log"
status: "status DATE.log"

day_override: "1/8/2025"  # Upload old readings from this date

temperatures:
  T1:
    sensor: "50K"
    log: "CH1 T DATE.log"
  T2:
    sensor: "4K"
    log: "CH2 T DATE.log"
  T3:
    sensor: "magnet"
    log: "CH3 T DATE.log"
  T5:
    sensor: "still"
    log: "CH5 T DATE.log"
  T6:
    sensor: "mxc"
    log: "CH6 T DATE.log"
