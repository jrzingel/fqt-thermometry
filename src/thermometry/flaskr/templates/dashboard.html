{% extends 'base.html' %}

{% block content %}


<div class="w-full flex flex-col md:flex-row md:justify-between md:items-center gap-3">
    <div class="flex flex-col sm:flex-row sm:items-center gap-2">
        <div>
            <p class="text-sm md:text-base">
                <span class="hidden md:inline">Click and drag to zoom in. Double click to reset.</span>
                <span class="md:hidden">Pinch to zoom. Double tap to reset.</span>
                Auto-updates with live data.
            </p>
            {% if showPressures %}
                <p class="text-sm">See fridge schematic <a href="{{ url_for('static', filename='images/fridge.webp') }}" target="_blank" class="text-blue-600 underline underline-offset-2 hover:text-blue-800">here</a></p>
            {% endif %}
        </div>
        <h2 id="status" class="text-sm font-medium">Loading page</h2>
    </div>

    <div class="flex items-center gap-2">
        <div class="flex rounded-md border border-gray-300 bg-white">
            <button id="temperaturesBtn" class="px-2 py-2 rounded-md text-gray-700 bg-white hover:bg-gray-200 focus:outline-none text-sm">Temperatures</button>
            <button id="pressuresBtn" class="px-2 py-2 rounded-md text-gray-700 bg-white hover:bg-gray-200 focus:outline-none text-sm">Pressures</button>
        </div>
    </div>

    <div class="w-full md:w-1/5">
        <div class="flex justify-between items-center">
            <label for="startTime" class="block text-sm font-medium text-gray-700">Time from:</label>
        </div>
        <div class="flex items-center space-x-2 mt-1">
            <input type="datetime-local" id="startTime" class="flex-grow min-w-0 p-1 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
            <button id="goButton" class="bg-blue-600 text-white px-2 py-2 rounded-md shadow hover:bg-blue-700 text-center">Go</button>
        </div>
        <div class="flex flex-wrap items-center gap-1 p-1 mt-1 rounded-md bg-gray-100">
            <button id="1" class="timeButton flex-1 min-w-0 h-8 bg-gray-100 rounded-md hover:bg-gray-200 text-center text-sm">1H</button>
            <button id="3" class="timeButton flex-1 min-w-0 h-8 bg-gray-100 rounded-md hover:bg-gray-200 text-center text-sm">3H</button>
            <button id="12" class="timeButton flex-1 min-w-0 h-8 bg-gray-100 rounded-md hover:bg-gray-200 text-center text-sm">12H</button>
            <button id="24" class="timeButton flex-1 min-w-0 h-8 bg-gray-100 rounded-md hover:bg-gray-200 text-center text-sm">1D</button>
            <button id="72" class="timeButton flex-1 min-w-0 h-8 bg-gray-100 rounded-md hover:bg-gray-200 text-center text-sm">3D</button>
        </div>
    </div>
</div>

<div id="graphs" ></div>

<script>
// Set ?type=... in the url based on the toggle
const pressuresBtn = document.getElementById('pressuresBtn');
const temperaturesBtn = document.getElementById('temperaturesBtn');
const params = new URLSearchParams(window.location.search);
const type = params.get('type');

function redirectWithQuery(param) {
    const url = new URL(window.location);
    url.searchParams.set('type', param);
    window.location = url; // Full reload with new query param
}

pressuresBtn.addEventListener('click', () => { redirectWithQuery('pressures'); });
temperaturesBtn.addEventListener('click', () => { redirectWithQuery('temperatures'); });

if (type === 'pressures') {
    pressuresBtn.classList.remove('bg-white', 'text-gray-700', 'hover:bg-gray-200');
    pressuresBtn.classList.add('bg-blue-600', 'text-white');
} else {
    temperaturesBtn.classList.remove('bg-white', 'text-gray-700', 'hover:bg-gray-200');
    temperaturesBtn.classList.add('bg-blue-600', 'text-white');
}
</script>

<script>
function setupPlots(num_plots) {
    console.time("chart");

    let data = Array.from({ length: num_plots + 1 }, () => []);
    let mooSync = uPlot.sync("moo");

    const matchSyncKeys = (own, ext) => own == ext;

    const cursorOpts = {
        lock: true,
        focus: {
            prox: 16
        },
        sync: {
            key: mooSync.key,
            setSeries: true,
            match: [matchSyncKeys, matchSyncKeys]
        }
    }

    const seriesOpts = [{}]
    for (let i = 1; i < data.length; i++) {
        seriesOpts.push({
            label: capitalize(SENSORS[i - 1]),
            stroke: COLOURS[i - 1],
            spanGaps: true,
            value: (u, v) => v == null ? '' : formatNumber(v, dp=4) + " " + MAIN_UNIT
        });
    }

    const opts_main = {
        title: TITLE,
        ...getSize(),
        focus: {
            alpha: 0.3,
        },
        cursor: cursorOpts,
        series: seriesOpts,
        scales: {
            y: {
                distr: 3
            }
        },
        axes: [
            { grid: {show: true} },
            { grid: {show: false} },
        ],
    }

    let uplot_main = new uPlot(opts_main, data, document.getElementById("graphs"));

    let uplots = [];

    // For each sensor, create their own subplot
    for (const i of SUBPLOT_ORDER) {
        // Plot [data[0] (timestamps), data[i] (sensor data)]
        let opts = {
            ...getSize(false),
            focus: {
                alpha: 0.3,
            },
            cursor: cursorOpts,
            series: [
                {},
                {
                    label: capitalize(SENSORS[i]),
                    stroke: COLOURS[i],
                    spanGaps: true,
                    value: (u, v) => v == null ? '' : formatNumber(v, dp=4) + " " + UNITS[i],
                }
            ],
            axes: [
                { },
                {  values: (u, v, w) => v == null ? [] : formatNumbers(v, dp=2) },
            ],
        }

        let uplot = new uPlot(opts, [data[0], data[i+1]], document.getElementById("graphs"));
        uplots.push(uplot);
    }

    // Dynamically change the size of the plot when required
    window.addEventListener("resize", function() {
        uplot_main.setSize(getSize());
        for (let uplot of uplots) {
            uplot.setSize(getSize(false));
        }
    });

    console.timeEnd("chart");
    return [uplot_main, uplots]
}

function go() {
    let status = document.getElementById("status");  // Update this to let the user know the progress

    status.textContent = "Rendering charts...";
    let plots = setupPlots(SENSORS.length);

    function refreshData() {
        status.textContent = "Fetching data..."
        fetchFromAPI("{{ url }}", FRIDGE, SENSORS)
            .then(packed => {
                let data = prepData(packed, SENSORS);

                let isZoomed = plots[0].scales.x.min > plots[0].data[0][0] || plots[0].scales.x.max < plots[0].data[0][plots[0].data[0].length - 1];
                plots[0].setData(data, resetScales=!isZoomed);
                for (let i = 0; i < SENSORS.length; i++) {
                    let pI = SUBPLOT_ORDER[i]
                    plots[1][i].setData([data[0], data[pI+1].map(x => x == null ? null : x * RESCALE[pI])], resetScales=!isZoomed);
                }
                status.textContent = "";
            })
            .catch((error) => {
                status.textContent = "Error!";
                console.log(error);
            });
    }

    refreshData();
    setInterval(refreshData, 30_000);

    // Dynamically update the data when required
    document.getElementById("goButton").addEventListener("click", function() {
        if (document.getElementById("startTime").value === "") {
            return  // Don't do anything if the start time is empty
        }
        refreshData();
    });

    let buttons = document.getElementsByClassName("timeButton");
    for (b in buttons) {
        if (buttons.hasOwnProperty(b)) {
            buttons[b].addEventListener("click", function() {
                    setDefaultTimestamps(this.id);
                    refreshData();
                }
            )
        }
    }
}

// Specify graphs to plot.
// Will create one large plot for everything, and then an individual plot for each sensor.
const FRIDGE = "{{ fridge }}";
const COLOURS = ["blue", "red", "green", "purple", "orange", "pink"];

{% if showPressures %}
    const TITLE = "Pressures (mbar)";
    const SENSORS = ["P1", "P2", "P3", "P4", "P5", "P6"];
    const RESCALE = [1, 1, 1, 1, 1, 1];
    const SUBPLOT_ORDER = [0, 1, 2, 3, 4, 5];
    const UNITS = ['mBar', 'mBar', 'mBar', 'mBar', 'mBar', 'mBar'];
    const MAIN_UNIT = "mBar";
{% else %}
    const SENSORS = ["50K", "4K", "magnet", "still", "mxc"];
    const RESCALE = [1, 1, 1, 1, 1000];
    const TITLE = "Temperatures (K)";
    const SUBPLOT_ORDER = [0, 1, 3, 4, 2];
    const UNITS = ['K', 'K', 'K', 'K', 'mK'];
    const MAIN_UNIT = "K";
{% endif %}


setDefaultTimestamps();
go();

</script>
{% endblock %}
