<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="mobile-web-app-capable" content="yes">
    <title>FQT Status</title>
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='uPlot.min.css') }}">
    <style>
			.uplot {
				display: inline-block;
				vertical-align: top;
			}
    </style>
    <script src="{{ url_for('static', filename='uPlot.iife.min.js') }}"></script>
</head>
<body class="bg-gray-100">
    <div class="flex flex-col h-screen">

    <!-- Banner -->
    <header class="bg-blue-600 text-white text-center text-xl p-4 shadow-md">
            FQT Lab Thermometry
    </header>

    <div class="flex flex-1 overflow-hidden">
            <!-- Sidebar -->
            <nav class="w-1/8 bg-gray-800 text-white p-4 space-y-4 overflow-y-auto">
                <ul class="space-y-2">
                    <li><a href="?" class="block p-2 hover:bg-gray-700 rounded">All</a></li>
                    <li><a href="?fridge=queenie" class="block p-2 hover:bg-gray-700 rounded {% if fridge == 'queenie' %}bg-gray-700{% endif %}">Queenie</a></li>
                    <li><a href="?fridge=scarlett" class="block p-2 hover:bg-gray-700 rounded {% if fridge == 'scarlett' %}bg-gray-700{% endif %}">Scarlett</a></li>
                    <li><a href="?fridge=tallulah" class="block p-2 hover:bg-gray-700 rounded {% if fridge == 'tallulah' %}bg-gray-700{% endif %}">Tallulah</a></li>
                    <li><a href="?fridge=ursula" class="block p-2 hover:bg-gray-700 rounded {% if fridge == 'ursula' %}bg-gray-700{% endif %}">Ursula</a></li>
                    <li><a href="?fridge=venus" class="block p-2 hover:bg-gray-700 rounded {% if fridge == 'venus' %}bg-gray-700{% endif %}">Venus</a></li>
                    <li><a href="?fridge=winona" class="block p-2 hover:bg-gray-700 rounded {% if fridge == 'winona' %}bg-gray-700{% endif %}">Winona</a></li>
                </ul>
                <div class="mt-auto">
                    <a href="/docs" class="block bg-blue-600 text-white px-4 py-2 rounded-md shadow hover:bg-blue-700 text-center w-full">
                        Docs
                    </a>
                </div>
            </nav>

            <!-- Main Content -->
            <main class="flex-1 p-6 overflow-y-auto">
                <h1 class="text-2xl font-bold mb-4">{{ title }}</h1>
                <div id="workspace" class="bg-white p-6 rounded-lg shadow-md">
                    {% block content %}{% endblock %}
                </div>
            </main>
        </div>

    </div>
</body>
</html>
