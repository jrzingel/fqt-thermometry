<script>
// On the page load, get the last 7 days of data
function setDefaultTimestamps() {
    const now = new Date();
    const sevenDaysAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);

    document.getElementById("startTime").value = sevenDaysAgo.toISOString().slice(0, 16);
}


function getData(packed) {
    console.time('prep');
    // epoch,t1,t2,t3,t5,t6

    let data = packed;

    console.timeEnd("prep");
    return data;
}


function makeChart(data) {
    console.time("chart");

    let mooSync = uPlot.sync("moo");

    // Sync cursors between plots
    mooSync.sub(uplot1);
    mooSync.sub(uplot2);
    mooSync.sub(uplot3);

    const matchSyncKeys = (own, ext) => own == ext;

    const cursorOpts = {
        lock: true,
        focus: {
            prox: 16
        },
        sync: {
            key: mooSync.key,
            setSeries: true,
            match: [matchSyncKeys, matchSyncKeys]
        }
    }

    const opts1 = {
        title: "Temperatures",
        width: 1920,
        height: 400,
        focus: {
            alpha: 0.3,
        },
        cursor: cursorOpts,
        series: [
            {},
            {
                label: "T1",
                stroke: "blue",
                spanGaps: true,
                scale: "K",
                value: (u, v) => v == null ? '' : v.toFixed(3) + "K"
            },
            {
                label: "T2",
                stroke: "red",
                spanGaps: true,
                scale: "K",
                value: (u, v) => v == null ? '' : v.toFixed(3) + "K"
            },
            {
                label: "T3",
                stroke: "green",
                spanGaps: true,
                scale: "K",
                value: (u, v) => v == null ? '' : v.toFixed(3) + "K"
            },
            {
                label: "T5",
                stroke: "purple",
                spanGaps: true,
                scale: "K",
                value: (u, v) => v == null ? '' : v.toFixed(3) + "K"
            },
            {
                label: "T6",
                stroke: "orange",
                spanGaps: true,
                scale: "K",
                value: (u, v) => v == null ? '' : v.toFixed(3) + "K"
            }
        ],
        axes: [
            {},
            {
                scale: "K",
                values: (self, ticks) => ticks.map(v => v.toFixed(3) + "K"),
                label: "Temperature (K)"
            }
        ]
    }

    let uplot1 = new uPlot(opts1, data[0], document.getElementById("graphs"));

    console.timeEnd("chart");
}


async function fetchFromAPI(fridge, sensor) {
    const startTime = document.getElementById("startTime").value;
    const endTime = new Date().toISOString().slice(0, 16);
    const requestData = {
        earliest_timestamp: startTime,
        latest_timestamp: endTime,
        fridge: fridge,
        sensor: sensor
    };

    const response = await fetch('http://127.0.0.1:5000/api/v1/random_range', {
        method: 'POST',
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(requestData)
    });
    const json_data = await response.json();
    console.log(json_data);

    // Convert to unix timestamp

    let data = [
        json_data.timestamps.map(t => Math.floor(new Date(t).getTime()) / 1000),
        json_data.readings
    ];

    return data;
}

function go() {
    let status = document.getElementById("status");  // Update this to let the user know the progress
    status.textContent = "Fetching data..."
    fetchData().then(packed => {
        status.textContent = "Data fetched, rendering..."
        let data = prepData(packed);
        setTimeout(() => makeChart(data), 0);
    });
}

// Specify graphs to plot.
// Will create one large plot for everything, and then an individual plot for each sensor.
const fridge = "test";
const sensors = ["T1 50K", "T2 4K", "T3 Magnet", "T5 Still", "T6 MXC"];

document.getElementById("startTime").addEventListener("change", go);
go();

</script>
