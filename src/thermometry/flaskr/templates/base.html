<!DOCTYPE html>
<html lang="en">
<head>
    <title>FQT Status</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-title" content="FQT Thermometry">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon-96x96.png') }}" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}" />
    <link rel="manifest" href="{{  url_for('static', filename='site.webmanifest') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='uPlot.min.css') }}">
    <style>
			.uplot {
				display: inline-block;
				vertical-align: top;
			}
    </style>
    <script src="{{ url_for('static', filename='uPlot.iife.min.js') }}"></script>
    <script src="{{ url_for('static', filename='gauge.min.js') }}"></script>
    <script src="{{ url_for('static', filename='utils.js') }}"></script>
</head>
<body class="h-screen overflow-hidden bg-gray-100">
    <div class="flex flex-col h-screen">

    <!-- Banner -->
    <header class="bg-blue-600 text-white text-center text-xl p-4 shadow-md">
            FQT Lab Thermometry
    </header>

    <div class="flex flex-1 h-full overflow-hidden">
            <!-- Sidebar -->
            <nav class="w-1/8 bg-gray-800 text-white p-4 space-y-4 overflow-y-auto">
                <ul class="space-y-2">
                    <li><a href="/dashboard" class="block p-2 hover:bg-gray-700 rounded {% if menu == "all" %}bg-gray-700{% endif %}">All</a></li>
                    <hr class="border-gray-700 my-4">
                    {% for fridge_name in fridges %}
                        <li><a href="/dashboard?fridge={{ fridge_name }}" class="block p-2 hover:bg-gray-700 rounded {% if menu == fridge_name %}bg-gray-700{% endif %}">{{ fridge_name.capitalize() }}</a></li>
                    {% endfor %}
                    <hr class="border-gray-700 my-4">
                    <li><a href="/dashboard/alerts" class="block p-2 hover:bg-gray-700 rounded {% if menu == "alerts" %}bg-gray-700{% endif %}">Alerts</a></li>
                    <li><a href="/dashboard/gauges" class="block p-2 hover:bg-gray-700 rounded {% if menu == "gauges" %}bg-gray-700{% endif %}">Gauges</a></li>
                    <li><a href="/docs" class="block p-2 hover:bg-gray-700 rounded">Docs</a></li>
                </ul>
            </nav>

            <!-- Main Content -->
            <main class="flex-1 p-6 overflow-y-auto">
                <h1 class="text-2xl font-bold mb-4">{{ title }}</h1>
                <div id="workspace" class="bg-white p-6 rounded-lg shadow-md">
                    {% block content %}{% endblock %}
                </div>
            </main>
        </div>

    </div>
</body>
</html>
