{% extends 'base.html' %}

{% block content %}
<script src="{{ url_for('static', filename='gauge.min.js') }}"></script>

<div class="w-full flex justify-between items-center">
    <p>Click and drag to zoom in. Double click to reset the window. Automatically updates with live data.</p>
    <h2 id="status">Loading page...</h2>
</div>

<div class="flex space-x-4 overflow-x-auto py-4">
    <div class="bg-white dark:bg-gray-800 p-4 rounded shadow text-center">
        <h3 class="text-sm font-medium mb-2">Turbo speed</h3>
        <canvas id="turbo" width="200" height="180" class="mx-auto"></canvas>
        <div id="turbo-value" class="mt-2 text-lg font-semibold">—</div>
    </div>

    <div class="bg-white dark:bg-gray-800 p-4 rounded shadow text-center">
        <h3 class="text-sm font-medium mb-2">Oil Temperature</h3>
        <canvas id="oil" width="200" height="180" class="mx-auto"></canvas>
        <div id="oil-value" class="mt-2 text-lg font-semibold">—</div>
    </div>

    <div class="bg-white dark:bg-gray-800 p-4 rounded shadow text-center">
        <h3 class="text-sm font-medium mb-2">Water in</h3>
        <canvas id="water-in" width="200" height="180" class="mx-auto"></canvas>
        <div id="water-in-value" class="mt-2 text-lg font-semibold">—</div>
    </div>

    <div class="bg-white dark:bg-gray-800 p-4 rounded shadow text-center">
        <h3 class="text-sm font-medium mb-2">Water out</h3>
        <canvas id="water-out" width="200" height="180" class="mx-auto"></canvas>
        <div id="water-out-value" class="mt-2 text-lg font-semibold">—</div>
    </div>
</div>

<script>
var commmon_opts = {
    angle: -0.24, // The span of the gauge arc
    lineWidth: 0.18, // The line thickness
    radiusScale: 0.8, // Relative radius
    pointer: {
        length: 0.6, // // Relative to gauge radius
        strokeWidth: 0.035, // The thickness
        color: '#000000' // Fill color
    },
    limitMax: true,     // If false, max value increases automatically if value > maxValue
    limitMin: false,     // If true, the min value of the gauge will be fixed
    //colorStart: '#6FADCF',   // Colors
    //colorStop: '#8FC0DA',    // just experiment with them
    //strokeColor: '#E0E0E0',  // to see which ones work best for you
    generateGradient: true,
    highDpiSupport: true,     // High resolution support
}

var turbo_opts = Object.assign({}, commmon_opts, {
    staticLabels: {
        font: "10px sans-serif",  // Specifies font
        labels: [0, 200, 400, 600, 800, 1000],  // Print labels at these values
        color: "#000000",  // Optional: Label text color
        fractionDigits: 0  // Optional: Numerical precision. 0=round off.
    },
    staticZones: [
        {strokeStyle: "#FFDD00", min: 0, max: 850}, // Yellow
        {strokeStyle: "#30B32D", min: 750, max: 850}, // Green
        {strokeStyle: "#FFDD00", min: 850, max: 1000}, // Yellow
    ],
});

var oil_opts = Object.assign({}, commmon_opts, {
    staticLabels: {
        font: "10px sans-serif",  // Specifies font
        labels: [0, 20, 40, 60, 80],  // Print labels at these values
        color: "#000000",  // Optional: Label text color
        fractionDigits: 0  // Optional: Numerical precision. 0=round off.
    },
    staticZones: [
        {strokeStyle: "#FFDD00", min: 0, max: 10}, // Yellow
        {strokeStyle: "#30B32D", min: 10, max: 35}, // Green
        {strokeStyle: "#FFDD00", min: 35, max: 40}, // Yellow
        {strokeStyle: "#F03E3E", min: 40, max: 80}  // Red
    ],
});

var water_in_opts = Object.assign({}, commmon_opts, {
    staticLabels: {
        font: "10px sans-serif",
        labels: [0, 5, 10, 15, 20, 25],
        color: "#000000",
        fractionDigits: 0
    },
    staticZones: [
        {strokeStyle: "#FFDD00", min: 0, max: 5}, // Yellow
        {strokeStyle: "#30B32D", min: 5, max: 18}, // Green
        {strokeStyle: "#FFDD00", min: 18, max: 20}, // Yellow
        {strokeStyle: "#F03E3E", min: 20, max: 30}  // Red
    ],
});

var water_out_opts = Object.assign({}, commmon_opts, {
    staticLabels: {
        font: "10px sans-serif",  // Specifies font
        labels: [0, 10, 20, 30, 40, 50],  // Print labels at these values
        color: "#000000",  // Optional: Label text color
        fractionDigits: 0  // Optional: Numerical precision. 0=round off.
    },
    staticZones: [
        {strokeStyle: "#FFDD00", min: 0, max: 10}, // Yellow
        {strokeStyle: "#30B32D", min: 10, max: 40}, // Green
        {strokeStyle: "#FFDD00", min: 40, max: 50}, // Yellow
    ],
});


function createGauge(canvasId, valueId, opts, maxValue, initial, unit) {
    var el = document.getElementById(canvasId);
    var valEl = document.getElementById(valueId);
    var g = new Gauge(el).setOptions(opts);
    if (maxValue !== undefined) g.maxValue = maxValue;
    g.setMinValue(0);
    g.animationSpeed = 40;
    g.set(initial);
    if (valEl) valEl.textContent = initial + " " + unit;
    return { gauge: g, valueEl: valEl, unit: unit};
}

function updateGauge(gaugeObj, value) {
    gaugeObj.gauge.set(value);
    if (gaugeObj.valueEl) {
        gaugeObj.valueEl.textContent = value + " " + gaugeObj.unit;
    }
}

{#var target = document.getElementById('turbo'); // your canvas element#}
{#var gauge = new Gauge(target).setOptions(turbo_opts); // create sexy gauge!#}
{#gauge.maxValue = 1000; // set max gauge value#}
{#gauge.setMinValue(0);  // Prefer setter over gauge.minValue = 0#}
{#gauge.animationSpeed = 32; // set animation speed (32 is default value)#}
{#gauge.set(512); // set actual value#}

{#var target = document.getElementById('oil'); // your canvas element#}
{#var gauge = new Gauge(target).setOptions(oil_opts); // create sexy gauge!#}
{#gauge.maxValue = 80; // set max gauge value#}
{#gauge.setMinValue(0);  // Prefer setter over gauge.minValue = 0#}
{#gauge.animationSpeed = 32; // set animation speed (32 is default value)#}
{#gauge.set(32); // set actual value#}

var turboGauge = createGauge('turbo', 'turbo-value', turbo_opts, 1000, 800, "Hz");
var oilGauge = createGauge('oil', 'oil-value', oil_opts, 80, 18, "C");
var waterInGauge = createGauge('water-in', 'water-in-value', water_in_opts, 30, 17, "C");
var waterOutGauge = createGauge('water-out', 'water-out-value', water_out_opts, 50, 25, "C");

function refreshData() {
    let status = document.getElementById("status");
    status.textContent = "Loading data...";
    fetch("/api/gauges")
        .then((response) => response.json())
        .then((data) => {
            turboGauge.gauge.set(data.turbo_speed);
            turboGauge.valueEl.textContent = data.turbo_speed + " Hz";

            oilGauge.gauge.set(data.oil_temp);
            oilGauge.valueEl.textContent = data.oil_temp + " °C";

            waterInGauge.gauge.set(data.water_in);
            waterInGauge.valueEl.textContent = data.water_in + " °C";

            waterOutGauge.gauge.set(data.water_out);
            waterOutGauge.valueEl.textContent = data.water_out + " °C";

            status.textContent = "";
        })
        .catch((error) => {
            status.textContent = "Error!";
            console.log(error);
        });
}

</script>


{% endblock %}
